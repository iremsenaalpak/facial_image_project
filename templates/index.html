<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BeautyDSP Studio | Giriş</title>
    <link rel="stylesheet" href="/static/css/style.css?v=200">
</head>

<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#F7F4EF;">

    <div style="text-align:center; max-width:450px; width:90%;">

        <h1 style="font-size:48px; margin-bottom:10px;">
            FaceLab <span style="color:#D38E8A;">Studio</span>
        </h1>

        <p style="color:#8A7E78; margin-bottom:40px;">
            Start your virtual makeup and filter experience.
        </p>

        <!-- FOTOĞRAF YÜKLE -->
        <form action="/upload_and_redirect"
              method="post"
              enctype="multipart/form-data"
              id="uploadForm">

            <input
                type="file"
                name="file"
                id="fileInput"
                accept=".jpg,.png"
                required
                style="display:none;"
                onchange="this.form.submit()">

            <div
                class="panel"
                style="padding:40px; border-radius:30px; cursor:pointer;"
                onclick="document.getElementById('fileInput').click()">

                <div style="font-size:50px; margin-bottom:15px;">
                    ✨
                </div>

                <p>
                    Upload your photo here and
                    <br>
                    go to the studio.
                </p>

            </div>
        </form>

        <!-- REALTIME KAMERA -->
        <a href="/transform?camera=1"
           style="
                display:inline-block;
                margin-top:20px;
                padding:16px 30px;
                background:#4a3c38;
                color:white;
                text-decoration:none;
                border-radius:18px;
                font-weight:600;
                transition:0.2s;
           ">
            📷 Start with Real-Time Camera
        </a>

        <!-- TEST GÖRSELLERİ -->
        <div style="margin-top:35px;">

            <p style="color:#8A7E78; margin-bottom:15px;">
                Or choose a sample photo:
            </p>

            <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">

                <a href="/load_test_image?image_name=angelina_jolie.jpg">
                    <img
                        src="/assets/test_images/angelina_jolie.jpg"
                        style="width:80px;height:80px;object-fit:cover;border-radius:18px;">
                </a>

                <a href="/load_test_image?image_name=miley_cyrus.png">
                    <img
                        src="/assets/test_images/miley_cyrus.png"
                        style="width:80px;height:80px;object-fit:cover;border-radius:18px;">
                </a>

                <a href="/load_test_image?image_name=millie_bobby_brown.png">
                    <img
                        src="/assets/test_images/millie_bobby_brown.png"
                        style="width:80px;height:80px;object-fit:cover;border-radius:18px;">
                </a>

                <a href="/load_test_image?image_name=sabrina_carpenter.png">
                    <img
                        src="/assets/test_images/sabrina_carpenter.png"
                        style="width:80px;height:80px;object-fit:cover;border-radius:18px;">
                </a>

            </div>

        </div>

    </div>

</body>
</html>
